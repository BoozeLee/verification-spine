name: spine-check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: suite + self-check (py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the oldest supported (requires-python); 3.12 is the release
        # runner; 3.13 is current. requires-python promises >=3.10, so the
        # floor is tested, not assumed.
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      # `build` is needed by the release claim: hosted runners have no `uv`, so
      # bin/release-check.sh falls back to `python3 -m build` (PEP 517).
      - name: Install
        run: python3 -m pip install --quiet pytest build

      # The suite includes tests/test_tamper.py, which attacks the checker
      # directly, and tests/test_vacuity.py, which requires mutation to restore
      # the tree byte-for-byte. A leak here means a mutation outlived its run.
      - name: Test suite
        run: python3 -m pytest -q

      - name: Confirm the tree is untouched by the mutation tests
        run: git diff --exit-code

      # Per the proof-before-claim discipline: a gate nobody has watched fail
      # is green, not verified. This job plants a defect in its own evidence
      # and confirms the checker goes red, then restores and confirms green.
      - name: Negative control — tamper a claim and confirm the checker objects
        run: |
          set -e
          script=tests/fixtures/repo_tamper/verify.sh
          cp "$script" /tmp/verify.sh.bak
          restore() { cp /tmp/verify.sh.bak "$script"; }
          trap restore EXIT

          printf '#!/bin/sh\nexit 1\n' > "$script"
          chmod +x "$script"

          if ./bin/spine-check tests/fixtures/repo_tamper --claims --adrs --ci; then
            echo "::error::the checker passed a deliberately broken claim"
            exit 1
          fi
          echo "negative control passed: a broken claim was rejected"

      # Includes the release claim: builds sdist + wheel, installs the wheel
      # into a fresh venv, and requires it to discriminate the fixtures. Via uv
      # when present, PEP 517 `build` otherwise (installed above).
      - name: The spine checks itself
        run: ./bin/spine-check . --claims --adrs --ci

      # --vacuity is not run here. This repo's own claims are deliberately not
      # self-hosting (a claim cannot mutate itself without recursing), and
      # forcing a mutation would either recurse or manufacture false findings —
      # the equivalent-mutant trap documented in spec/conformance.md. The
      # vacuity engine is covered by tests/test_vacuity.py below, and the
      # release claim's mutation is exercised locally (see harness/build-log.md).
      - name: Unit tests for the vacuity engine
        run: python3 -m pytest tests/test_vacuity.py -q
