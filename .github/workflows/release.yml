name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    name: build wheel + sdist, smoke them, publish the GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install the build frontend
        run: python3 -m pip install --quiet build

      - name: Build sdist and wheel from the tagged tree
        run: python3 -m build

      # The wheel a user gets must behave like the source tree: refuse broken
      # repositories, accept a conformant one. Fixtures only — running the
      # installed tool against this repository would recurse into its own
      # manifest claims. repo_tamper would be the wrong fixture here: it is
      # conformant until a defect is planted into it.
      - name: Smoke — install the wheel and run the controls
        run: |
          set -e
          python3 -m venv /tmp/spine-smoke
          /tmp/spine-smoke/bin/pip install --quiet dist/spine_check-*.whl
          /tmp/spine-smoke/bin/spine-check --help > /dev/null
          if /tmp/spine-smoke/bin/spine-check tests/fixtures/repo_fail --claims --ci > /dev/null 2>&1; then
            echo "::error::the installed wheel ACCEPTED a repository with a failing claim"
            exit 1
          fi
          if /tmp/spine-smoke/bin/spine-check tests/fixtures/repo_bad_adrs --adrs > /dev/null 2>&1; then
            echo "::error::the installed wheel ACCEPTED an unenforced ADR"
            exit 1
          fi
          /tmp/spine-smoke/bin/spine-check tests/fixtures/repo_ok --claims --adrs --ci > /dev/null

      # Build provenance (SLSA): binds these exact artifacts to this workflow
      # run — verifiable later with
      # `gh attestation verify <artifact> -R BoozeLee/verification-spine`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/spine_check-*.whl"

      # PyPI publishing is intentionally absent. jev ruled `hold` (0.98) and
      # ADR-0003 keeps it that way until reversed in writing. When that happens,
      # add trusted publishing here — do not use a token secret.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
